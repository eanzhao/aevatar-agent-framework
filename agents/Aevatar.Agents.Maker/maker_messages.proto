syntax = "proto3";
option csharp_namespace = "Aevatar.Agents.Maker";

import "google/protobuf/timestamp.proto";

// ==============================
// Task Agent State & Config
// ==============================

message TaskAgentState {
    string task_id = 1;
    string parent_id = 2;
    string original_goal = 3;

    enum Phase {
        PHASE_CREATED = 0;
        PHASE_ASSESSING_COMPLEXITY = 1;
        PHASE_WAITING_FOR_PROPOSALS = 2;
        PHASE_EXECUTING_CHILDREN = 3;
        PHASE_COMPLETED = 4;
        PHASE_FAILED = 5;
    }
    Phase phase = 4;

    map<string, int32> vote_tallies = 5;
    map<string, string> candidate_content = 6;

    repeated string child_agent_ids = 7;
    map<string, string> child_results = 8;

    string final_result = 9;
    int32 red_flag_count = 10;
    int32 current_depth = 11;
    string active_request_id = 12;
    string preferred_plan_hash = 13;
    string failure_reason = 14;

    message PlannedStep {
        string step_id = 1;
        string description = 2;
    }

    repeated PlannedStep planned_steps = 15;
    repeated string pending_child_ids = 16;

    enum GenerationRequestType {
        GENERATION_REQUEST_TYPE_NONE = 0;
        GENERATION_REQUEST_TYPE_DECOMPOSITION = 1;
        GENERATION_REQUEST_TYPE_ATOMIC_SOLVE = 2;
    }
    GenerationRequestType active_generation_type = 17;

    int32 proposal_attempts = 18;
    google.protobuf.Timestamp last_updated_at = 19;

    // Micro-Steps State
    repeated string micro_objectives = 20;
    repeated string micro_summaries = 21;
    int32 micro_cursor = 22;
    bool micro_mode_active = 23;
    string micro_current_objective = 24;

    // Semantic Voting
    message VoteCluster {
        string cluster_id = 1; // Hash of the representative content
        string representative_content = 2;
        repeated float representative_embedding = 3;
        int32 vote_count = 4;
        repeated string variant_hashes = 5;
    }
    map<string, VoteCluster> vote_clusters = 25;
}

message TaskAgentConfig {
    // "K" value for consensus
    int32 consensus_threshold_k = 1;
    // Maximum recursion depth
    int32 max_depth = 2;
    // Maximum voting retry attempts before red flag
    int32 max_attempts = 3;
    // System prompt template used by supervising agent
    string system_prompt_template = 4;
    // LLM provider name resolved via options
    string provider_name = 5;
    // Number of worker requests issued per round
    int32 initial_fan_out = 6;
    // Maximum proposal count before forcing new round
    int32 max_candidate_wait = 7;
    // Stop sequences enforced on worker responses
    repeated string worker_stop_sequences = 8;
    // Max tokens per worker response
    int32 worker_response_token_limit = 9;
    // Force micro-step question flow
    bool enforce_micro_steps = 10;
    // Allow task agent to act as self worker
    bool enable_self_worker = 11;
    // Automatically create/link MakerTaskAgent children when recursion is triggered
    bool auto_link_children = 12;
    // Desired minimum number of child agents kept linked for recursion
    int32 child_pool_size = 13;
    // Threshold for semantic clustering (0.0-1.0, default ~0.95)
    float semantic_similarity_threshold = 14;
    // Use dedicated consensus agent instead of embedded logic
    bool use_consensus_agent = 15;
}

// ==============================
// Worker Agent State & Config
// ==============================

message WorkerAgentState {
    string worker_id = 1;
    int32 total_requests = 2;
    google.protobuf.Timestamp last_request_at = 3;
    string active_role = 4;
}

message WorkerAgentConfig {
    string provider_name = 1;
    string default_model = 2;
    int32 max_output_tokens = 3;
    bool enable_reviewer_role = 4;
    float temperature = 5;
}

// ==============================
// Event Definitions
// ==============================

message AssignTaskEvent {
    string task_id = 1;
    string goal_description = 2;
    int32 current_depth = 3;
    map<string, string> context_variables = 4;
}

message GenerateProposalEvent {
    string request_id = 1;
    string task_description = 2;

    enum GenerationType {
        GENERATION_TYPE_DECOMPOSITION = 0;
        GENERATION_TYPE_ATOMIC_SOLVE = 1;
    }
    GenerationType type = 3;
    int32 max_output_tokens = 4;
    repeated string stop_sequences = 5;
    string stage_hint = 6;
    string task_id = 7;
}

message ProposalReceivedEvent {
    string request_id = 1;
    string content = 2;
    string reasoning_trace = 3;
    string task_id = 4;
}

message TaskOutcomeEvent {
    string task_id = 1;
    bool success = 2;
    string result_data = 3;
    string failure_reason = 4;
}

message RedFlagRaisedEvent {
    string task_id = 1;
    string reason = 2;
    int32 attempt = 3;
}

// ==============================
// Consensus Agent State & Events
// ==============================

message TaskConsensusState {
    string task_id = 1;
    string request_id = 2;
    int32 total_votes = 3;
    map<string, int32> vote_tallies = 4;
    map<string, string> candidate_content = 5;
    map<string, TaskAgentState.VoteCluster> vote_clusters = 6;
    string leader_hash = 7;
    int32 leader_votes = 8;
    int32 runner_up_votes = 9;
    TaskAgentState.GenerationRequestType generation_type = 10;
    int32 consensus_threshold_k = 11;
    float semantic_similarity_threshold = 12;
    int32 max_candidate_wait = 13;
    int32 max_attempts = 14;
    int32 proposal_attempts = 15;
    bool has_reached_consensus = 16;
}

message StartConsensusEvent {
    string task_id = 1;
    string request_id = 2;
    TaskAgentState.GenerationRequestType generation_type = 3;
    int32 consensus_threshold_k = 4;
    float semantic_similarity_threshold = 5;
    int32 max_candidate_wait = 6;
    int32 max_attempts = 7;
}

message ConsensusResultEvent {
    string task_id = 1;
    string request_id = 2;
    bool success = 3;
    string winning_hash = 4;
    string winning_content = 5;
    int32 leader_votes = 6;
    int32 runner_up_votes = 7;
    TaskAgentState.GenerationRequestType generation_type = 8;
    string failure_reason = 9;
}



