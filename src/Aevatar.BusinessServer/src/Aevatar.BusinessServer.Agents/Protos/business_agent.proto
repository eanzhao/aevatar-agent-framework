syntax = "proto3";

package Business.Server;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Business.Server";

// State for SimpleBusinessAgent
message SimpleBusinessAgentState {
    string agent_id = 1;
    int32 processed_count = 2;
    string last_message = 3;
    google.protobuf.Timestamp last_updated = 4;
}

// Event for business message
message BusinessMessageEvent {
    string message = 1;
    google.protobuf.Timestamp timestamp = 2;
}
