syntax = "proto3";

package aevatar.agents.maker;
option csharp_namespace = "Aevatar.Agents.Maker.Messages";

import "google/protobuf/timestamp.proto";

// ============================================================
//  MAKER Coordinator Agent State
// ============================================================

message MakerCoordinatorState {
    string execution_id = 1;
    string task_description = 2;
    // field 3 removed (was max_depth, now replaced by budget)
    int32 consensus_k = 4;
    int32 samples_per_round = 5;
    int32 total_llm_calls = 6;
    
    // Status (0=idle, 1=starting, 2=running, 3=completed, 4=failed, 5=cancelled)
    int32 status = 7;
    string current_task_id = 8;
    int32 current_depth = 9;
    
    // Workers
    repeated string worker_ids = 10;
    int32 active_workers = 11;
    int32 pending_proposals = 12;
    
    // Timestamps
    google.protobuf.Timestamp started_at = 13;
    google.protobuf.Timestamp updated_at = 14;
    
    // Red flags
    repeated string red_flag_reasons = 15;
    
    // Token telemetry
    int64 total_tokens_used = 16;
    int64 total_prompt_tokens = 17;
    int64 total_completion_tokens = 18;
    
    // Budget limits
    int32 max_total_llm_calls = 19;
    int64 max_total_tokens = 20;
    int64 max_duration_ms = 21;
    
    // === P0-2: Runtime state persistence ===
    
    // Execution context (user-provided key-value pairs)
    map<string, string> execution_context = 22;
    
    // Serialized MakerOptions for resumption
    MakerOptionsProto options = 23;
    
    // Execution result (for completed runs)
    string result_content = 24;
    string result_error = 25;
    string result_trace_json = 26;
    
    // Valid provider names (discovered during startup)
    repeated string valid_providers = 27;
    string coordinator_provider = 28;
    
    // Stopwatch elapsed time (for duration tracking across restarts)
    int64 elapsed_ms = 29;
}

// Serializable version of MakerOptions for state persistence
message MakerOptionsProto {
    int32 consensus_k = 1;
    int32 samples_per_round = 2;
    int32 max_total_llm_calls = 3;
    int64 max_total_tokens = 4;
    int64 max_duration_ms = 5;
    int32 depth_warning_threshold = 6;
    int32 hard_depth_cap = 7;
    float base_temperature = 8;
    float temperature_variance = 9;
    float semantic_similarity_threshold = 10;
    string clustering_method = 11;
    string execution_mode = 12;  // "Production" or "Academic"
}

message MakerCoordinatorConfig {
    int32 default_consensus_k = 1;
    // field 2 removed (was max_depth, now replaced by budget)
    int64 step_timeout_ms = 4;
    string llm_provider_name = 5;
    float base_temperature = 6;
    float temperature_variance = 7;
    string clustering_method = 8;
    float semantic_similarity_threshold = 9;
    int32 worker_pool_size = 10;
    
    // Budget-based limits (replaces max_depth)
    int32 max_total_llm_calls = 11;
    int64 max_total_tokens = 12;
    int64 max_duration_ms = 13;
    int32 depth_warning_threshold = 14;
}

// ============================================================
//  MAKER Worker Agent State
// ============================================================

message MakerWorkerState {
    string worker_id = 1;
    string coordinator_id = 2;
    
    // Current task
    string current_task_id = 3;
    string current_request_id = 4;
    
    // Stats
    int32 total_proposals = 5;
    int32 successful_proposals = 6;
    int32 failed_proposals = 7;
    
    // Status (0=idle, 1=working, 2=completed)
    int32 status = 8;
    
    google.protobuf.Timestamp last_activity = 9;
}

message MakerWorkerConfig {
    string llm_provider_name = 1;
    float default_temperature = 2;
    int32 default_max_tokens = 3;
    int32 worker_index = 4;
}

// ============================================================
//  Events: External -> Coordinator (Start Task)
// ============================================================

// Request to start MAKER execution (sent by AgentMakerExecutor)
message StartMakerTaskRequest {
    string execution_id = 1;
    string task_description = 2;
    string provider_name = 3;              // Default provider (backward compatible)
    int32 consensus_k = 4;
    // field 5 removed (was max_depth, now replaced by budget)
    int32 samples_per_round = 6;
    float base_temperature = 8;
    float temperature_variance = 9;
    float semantic_similarity_threshold = 10;
    string clustering_method = 11;
    map<string, string> context = 12;
    
    // Budget-based limits (replaces max_depth)
    int32 max_total_llm_calls = 13;
    int64 max_total_tokens = 14;
    int64 max_duration_ms = 15;
    int32 depth_warning_threshold = 16;
    
    // Multi-provider support for decorrelation
    bool use_multiple_providers = 17;      // Enable multi-provider mode (auto-discover valid providers)
    string coordinator_provider_name = 18; // Optional dedicated provider for Coordinator
}

// ============================================================
//  Events: Coordinator -> Worker
// ============================================================

// Initialize worker agent
message InitializeWorkerRequest {
    string coordinator_id = 1;
    string provider_name = 2;
    int32 worker_index = 3;
    float temperature = 4;
}

// Request worker to generate a proposal
message GenerateProposalRequest {
    string request_id = 1;
    string task_id = 2;
    string system_prompt = 3;
    string user_prompt = 4;
    float temperature = 5;
    int32 max_tokens = 6;
    bool is_decomposition = 7;  // true=decomposition, false=solution
}

// Cancel current worker request (early termination when consensus reached)
message CancelCurrentRequest {
    string coordinator_id = 1;
    string reason = 2;  // e.g., "consensus_reached", "timeout", "budget_exceeded"
}

// ============================================================
//  Events: Worker -> Coordinator
// ============================================================

// Worker initialized and ready
message WorkerInitialized {
    string worker_id = 1;
    string coordinator_id = 2;
    int32 worker_index = 3;
}

// Worker proposal response
message ProposalResult {
    string request_id = 1;
    string task_id = 2;
    string worker_id = 3;
    string proposal_id = 4;
    string content = 5;
    bool success = 6;
    string error = 7;
    google.protobuf.Timestamp timestamp = 8;
    
    // Token usage telemetry
    int32 prompt_tokens = 9;
    int32 completion_tokens = 10;
    int32 total_tokens = 11;
    
    // Timing
    int64 latency_ms = 12;
    
    // LLM provider info for multi-provider mode
    string provider_name = 13;
    
    // Time To First Token (streaming latency metric)
    int64 ttft_ms = 14;
}

// ============================================================
//  Events: Coordinator -> External (Progress & Completion)
// ============================================================

message MakerProgressEvent {
    string execution_id = 1;
    string task_id = 2;
    string phase = 3;
    string message = 4;
    int32 depth = 5;
    google.protobuf.Timestamp timestamp = 6;
    
    // Voting progress
    int32 voting_round = 7;
    int32 voting_total = 8;
    int32 voting_leader = 9;
    int32 voting_runner_up = 10;
    int32 voting_needed = 11;
    
    // Proposal info
    string proposal_id = 12;
    string proposal_content = 13;
    bool proposal_success = 14;
}

// Execution completed
message MakerTaskCompleted {
    string execution_id = 1;
    bool success = 2;
    string content = 3;
    string error = 4;
    int32 total_llm_calls = 5;
    int64 duration_ms = 6;
    string trace_json = 7;  // Serialized MakerTrace
}
