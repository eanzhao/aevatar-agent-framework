syntax = "proto3";

package aevatar.trade;

import "google/protobuf/timestamp.proto";

// ============================================================================
// WEEX AI Trading System - Protobuf Message Definitions
// ============================================================================

// ============ Market Data Events ============

// 实时行情更新事件
message MarketTickEvent {
    string symbol = 1;                      // 交易对 (e.g., "BTCUSDT_SPBL")
    double price = 2;                       // 当前价格
    double bid = 3;                         // 买一价
    double ask = 4;                         // 卖一价
    double volume_24h = 5;                  // 24小时成交量
    double change_24h = 6;                  // 24小时涨跌幅
    double high_24h = 7;                    // 24小时最高
    double low_24h = 8;                     // 24小时最低
    google.protobuf.Timestamp timestamp = 9;
}

// K线数据更新事件
message KlineUpdateEvent {
    string symbol = 1;                      // 交易对
    string interval = 2;                    // 时间周期 (1m, 5m, 15m, 1h, 4h, 1d)
    double open = 3;                        // 开盘价
    double high = 4;                        // 最高价
    double low = 5;                         // 最低价
    double close = 6;                       // 收盘价
    double volume = 7;                      // 成交量
    google.protobuf.Timestamp open_time = 8;
    google.protobuf.Timestamp close_time = 9;
}

// 新闻数据事件
message NewsDataEvent {
    string id = 1;                          // 新闻ID
    string headline = 2;                    // 标题
    string content = 3;                     // 内容摘要
    string source = 4;                      // 来源
    repeated string tags = 5;               // 标签
    google.protobuf.Timestamp publish_time = 6;
}

// 社交媒体数据事件
message SocialDataEvent {
    string platform = 1;                    // 平台 (twitter, reddit, telegram)
    string content = 2;                     // 内容
    string author = 3;                      // 作者
    int32 engagement = 4;                   // 互动数
    string sentiment_hint = 5;              // 初步情绪判断
    google.protobuf.Timestamp timestamp = 6;
}

// ============ Analysis Events ============

// 市场情绪分析结果
message MarketSentimentAnalysisEvent {
    string symbol = 1;
    int32 sentiment_score = 2;              // -100 (极度恐慌) 到 +100 (极度贪婪)
    string sentiment_trend = 3;             // UP, DOWN, SIDEWAYS
    double fear_greed_index = 4;            // 恐慌贪婪指数 0-100
    double long_short_ratio = 5;            // 多空比
    double funding_rate = 6;                // 资金费率
    double open_interest = 7;               // 持仓量
    string analysis_summary = 8;            // AI 分析总结
    int32 confidence = 9;                   // 置信度 1-100
    google.protobuf.Timestamp timestamp = 10;
}

// 技术分析结果
message TechnicalAnalysisEvent {
    string symbol = 1;
    string trend_direction = 2;             // BULLISH, BEARISH, SIDEWAYS
    int32 trend_strength = 3;               // 1-10
    double support_level = 4;               // 支撑位
    double resistance_level = 5;            // 阻力位
    
    // 技术指标
    double rsi = 6;                         // RSI (14)
    double macd = 7;                        // MACD
    double macd_signal = 8;                 // MACD Signal
    double macd_histogram = 9;              // MACD Histogram
    double ma_20 = 10;                      // MA20
    double ma_60 = 11;                      // MA60
    double bollinger_upper = 12;            // 布林上轨
    double bollinger_lower = 13;            // 布林下轨
    double atr = 14;                        // ATR
    
    string signal = 15;                     // BUY, SELL, HOLD
    string pattern_detected = 16;           // 检测到的形态
    string analysis_summary = 17;           // AI 分析总结
    int32 confidence = 18;                  // 置信度 1-100
    google.protobuf.Timestamp timestamp = 19;
}

// 新闻影响分析结果
message NewsImpactAnalysisEvent {
    string news_id = 1;                     // 关联的新闻ID
    string headline = 2;                    // 新闻标题
    string impact_type = 3;                 // POSITIVE, NEGATIVE, NEUTRAL
    string impact_level = 4;                // HIGH, MEDIUM, LOW
    string impact_duration = 5;             // SHORT, MEDIUM, LONG
    repeated string affected_symbols = 6;   // 受影响的交易对
    double relevance_score = 7;             // 相关性评分 0-100
    string analysis_summary = 8;            // AI 分析总结
    int32 confidence = 9;                   // 置信度 1-100
    google.protobuf.Timestamp timestamp = 10;
}

// ============ Decision Events ============

// 交易决策事件 (Coordinator -> RiskManager)
message TradingDecisionEvent {
    string decision_id = 1;                 // 决策ID
    string symbol = 2;                      // 交易对
    string direction = 3;                   // BUY, SELL, HOLD
    int32 confidence = 4;                   // 置信度 1-100
    double suggested_position_pct = 5;      // 建议仓位百分比
    double suggested_price = 6;             // 建议价格 (0=市价)
    
    // 决策依据
    string sentiment_summary = 7;           // 情绪分析摘要
    string technical_summary = 8;           // 技术分析摘要
    string news_summary = 9;                // 新闻分析摘要
    string reasoning = 10;                  // 综合推理过程
    
    google.protobuf.Timestamp timestamp = 11;
}

// 交易批准事件 (RiskManager -> Executor)
message ApprovedTradeEvent {
    string decision_id = 1;                 // 关联的决策ID
    string symbol = 2;                      // 交易对
    string side = 3;                        // buy, sell
    string order_type = 4;                  // limit, market
    double quantity = 5;                    // 数量
    double price = 6;                       // 价格 (限价单)
    double stop_loss = 7;                   // 止损价
    double take_profit = 8;                 // 止盈价
    
    // 风控信息
    string risk_assessment = 9;             // LOW, MEDIUM, HIGH
    double position_size_adjusted = 10;     // 风控调整后仓位
    string risk_notes = 11;                 // 风控备注
    
    google.protobuf.Timestamp timestamp = 12;
}

// 交易拒绝事件
message TradeRejectedEvent {
    string decision_id = 1;                 // 关联的决策ID
    string symbol = 2;
    string original_direction = 3;          // 原始方向
    string rejection_reason = 4;            // 拒绝原因
    string risk_level = 5;                  // 风险等级
    repeated string violated_rules = 6;     // 违反的风控规则
    google.protobuf.Timestamp timestamp = 7;
}

// ============ Execution Events ============

// 订单执行成功事件
message OrderExecutedEvent {
    string order_id = 1;                    // WEEX 订单ID
    string client_order_id = 2;             // 客户端订单ID
    string decision_id = 3;                 // 关联的决策ID
    string symbol = 4;
    string side = 5;                        // buy, sell
    double quantity = 6;                    // 成交数量
    double filled_price = 7;                // 成交价格
    double fee = 8;                         // 手续费
    string status = 9;                      // FILLED, PARTIAL_FILLED
    google.protobuf.Timestamp timestamp = 10;
}

// 订单执行失败事件
message OrderFailedEvent {
    string client_order_id = 1;             // 客户端订单ID
    string decision_id = 2;                 // 关联的决策ID
    string symbol = 3;
    string side = 4;
    string error_code = 5;                  // 错误码
    string error_message = 6;               // 错误信息
    google.protobuf.Timestamp timestamp = 7;
}

// 订单取消事件
message OrderCancelledEvent {
    string order_id = 1;
    string client_order_id = 2;
    string symbol = 3;
    string reason = 4;                      // 取消原因
    google.protobuf.Timestamp timestamp = 5;
}

// ============ System Events ============

// 系统启动事件
message SystemStartedEvent {
    string system_id = 1;
    repeated string active_symbols = 2;     // 激活的交易对
    google.protobuf.Timestamp timestamp = 3;
}

// 系统停止事件
message SystemStoppedEvent {
    string system_id = 1;
    string reason = 2;                      // 停止原因
    google.protobuf.Timestamp timestamp = 3;
}

// 风控熔断事件
message CircuitBreakerTriggeredEvent {
    string trigger_type = 1;                // DAILY_LOSS, CONSECUTIVE_LOSS, VOLATILITY
    string description = 2;
    int32 cooldown_minutes = 3;             // 冷却时间
    google.protobuf.Timestamp timestamp = 4;
}

// ============ Agent States ============

// 数据采集器状态
message DataCollectorState {
    string agent_id = 1;
    repeated string subscribed_symbols = 2; // 已订阅的交易对
    map<string, double> latest_prices = 3;  // 最新价格缓存
    int32 ticks_received = 4;               // 收到的tick数
    bool is_connected = 5;                  // WebSocket连接状态
    google.protobuf.Timestamp last_tick_time = 6;
}

// 市场情绪分析师状态
message SentimentAnalystState {
    string agent_id = 1;
    int32 current_sentiment = 2;            // 当前情绪值
    repeated int32 sentiment_history = 3;   // 历史情绪值 (最近N个)
    int32 analysis_count = 4;               // 分析次数
    google.protobuf.Timestamp last_analysis = 5;
}

// 技术分析师状态
message TechnicalAnalystState {
    string agent_id = 1;
    string current_trend = 2;               // 当前趋势
    int32 trend_strength = 3;               // 趋势强度
    double last_rsi = 4;
    double last_macd = 5;
    int32 analysis_count = 6;
    google.protobuf.Timestamp last_analysis = 7;
}

// 新闻分析师状态
message NewsAnalystState {
    string agent_id = 1;
    repeated string recent_headlines = 2;   // 最近处理的新闻标题
    string overall_sentiment = 3;           // 整体新闻情绪
    int32 news_processed = 4;               // 处理的新闻数
    google.protobuf.Timestamp last_analysis = 5;
}

// 交易协调者状态
message CoordinatorState {
    string agent_id = 1;
    
    // 最新分析结果
    MarketSentimentAnalysisEvent latest_sentiment = 2;
    TechnicalAnalysisEvent latest_technical = 3;
    NewsImpactAnalysisEvent latest_news = 4;
    
    // 决策统计
    string last_decision = 5;               // 最近决策方向
    int32 decisions_made = 6;               // 决策次数
    int32 decisions_approved = 7;           // 被批准次数
    int32 decisions_rejected = 8;           // 被拒绝次数
    
    google.protobuf.Timestamp last_decision_time = 9;
}

// 风控经理状态
message RiskManagerState {
    string agent_id = 1;
    
    // 账户风险
    double total_equity = 2;                // 总权益
    double available_balance = 3;           // 可用余额
    double current_position_value = 4;      // 当前持仓价值
    double position_ratio = 5;              // 仓位比例
    
    // 盈亏统计
    double daily_pnl = 6;                   // 今日盈亏
    double daily_pnl_pct = 7;               // 今日盈亏百分比
    double realized_pnl = 8;                // 已实现盈亏
    double unrealized_pnl = 9;              // 未实现盈亏
    
    // 风控状态
    int32 consecutive_losses = 10;          // 连续亏损次数
    int32 consecutive_wins = 11;            // 连续盈利次数
    bool is_trading_allowed = 12;           // 是否允许交易
    string circuit_breaker_status = 13;     // 熔断状态
    
    // 统计
    int32 trades_approved = 14;             // 批准的交易数
    int32 trades_rejected = 15;             // 拒绝的交易数
    
    google.protobuf.Timestamp last_update = 16;
}

// 执行器状态
message ExecutorState {
    string agent_id = 1;
    
    // 订单统计
    int32 orders_placed = 2;                // 下单数
    int32 orders_filled = 3;                // 成交数
    int32 orders_failed = 4;                // 失败数
    int32 orders_cancelled = 5;             // 取消数
    
    // 活跃订单
    repeated string active_order_ids = 6;   // 活跃订单ID
    
    // 持仓
    map<string, double> positions = 7;      // symbol -> quantity
    
    // 总盈亏
    double total_realized_pnl = 8;          // 总已实现盈亏
    double total_fees = 9;                  // 总手续费
    
    google.protobuf.Timestamp last_execution = 10;
}

// ============ Configuration Messages ============

// 交易配置
message TradingConfig {
    string symbol = 1;                      // 交易对
    string interval = 2;                    // 分析周期
    double max_position_pct = 3;            // 最大仓位比例
    double max_loss_per_trade = 4;          // 单笔最大亏损
    double max_daily_loss = 5;              // 日最大亏损
    int32 min_confidence_to_trade = 6;      // 最小交易置信度
}

// 分析权重配置
message AnalysisWeightConfig {
    double sentiment_weight = 1;            // 情绪分析权重
    double technical_weight = 2;            // 技术分析权重
    double news_weight = 3;                 // 新闻分析权重
}
