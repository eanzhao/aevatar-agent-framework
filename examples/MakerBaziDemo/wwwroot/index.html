<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>MAKER 八字推演监控</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>MAKER 八字推演监控面板</h1>
      <p>实时查看任务拆分、投票与命理共识过程</p>
    </header>

    <main>
      <section class="controls">
        <button id="startBtn">开始新一轮推演</button>
        <div class="status">
          <span>运行状态：</span>
          <strong id="statusText">未启动</strong>
        </div>
      </section>

      <section class="snapshot">
        <h2>任务快照</h2>
        <div class="grid">
          <div>
            <span class="label">阶段</span>
            <span id="phase">-</span>
          </div>
          <div>
            <span class="label">层级</span>
            <span id="depth">-</span>
          </div>
          <div>
            <span class="label">微目标</span>
            <span id="microObjective">-</span>
          </div>
          <div>
            <span class="label">子任务待完成</span>
            <span id="pendingChildren">-</span>
          </div>
        </div>

        <div class="panel">
          <h3>候选投票</h3>
          <table id="votesTable">
            <thead>
              <tr>
                <th>候选 Hash</th>
                <th>票数</th>
                <th>预览</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="panel">
          <h3>微目标列表</h3>
          <ol id="microList"></ol>
        </div>

        <div class="panel">
          <h3>当前计划</h3>
          <table id="stepsTable">
            <thead>
              <tr>
                <th>步骤ID</th>
                <th>描述</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="panel">
          <h3>最终结果</h3>
          <pre id="finalResult">暂无结果</pre>
        </div>
      </section>

      <section class="workers">
        <h2>Worker Streaming 对话</h2>
        <div id="workersContainer" class="workers-grid"></div>
      </section>

      <section class="timeline">
        <h2>实时日志</h2>
        <ul id="timelineList"></ul>
      </section>
    </main>

    <footer>
      <span>MAKER Bazi Demo · Aevatar Agent Framework</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
