<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAKER Paper Summary</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <h1>MAKER 论文总结演示</h1>
        <p>First-to-Ahead-by-K Consensus System: Paper Summarization</p>
      </div>
      <div class="header-controls">
        <button id="startBtn">⚡️ 开始新一轮推演</button>
      </div>
    </header>

    <main>
      <section class="status-bar">
        <div class="status-item">
          <span class="label">运行状态</span>
          <strong id="statusText" class="value status-idle">未启动</strong>
        </div>
        <div class="status-item">
          <span class="label">当前阶段</span>
          <span id="phase" class="value">-</span>
        </div>
        <div class="status-item">
          <span class="label">递归深度</span>
          <span id="depth" class="value">-</span>
        </div>
        <div class="status-item">
          <span class="label">当前微目标</span>
          <span id="microObjective" class="value" style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">-</span>
        </div>
      </section>

      <div class="dashboard-grid">
        <!-- 左列：投票与计划 -->
        <div class="col-left">
          <div class="panel votes-panel">
            <h3>🗳️ 候选提案投票 (Semantic Clustering)</h3>
            <div class="table-container">
              <table id="votesTable">
                <thead>
                  <tr>
                    <th width="15%">Cluster ID</th>
                    <th width="15%">票数</th>
                    <th>提案内容预览</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td colspan="3" class="empty">暂无数据</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="panel plan-panel">
            <h3>📋 任务分解树</h3>
            <div id="pendingChildren" class="pending-tags"></div>
            <div class="table-container">
              <table id="stepsTable">
                <thead>
                  <tr>
                    <th width="15%">ID</th>
                    <th>子任务描述</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td colspan="2" class="empty">暂无计划</td></tr>
                </tbody>
              </table>
            </div>
          </div>
          
          <div class="panel micro-panel">
             <h3>🎯 微目标进度</h3>
             <ol id="microList"></ol>
          </div>
        </div>

        <!-- 右列：Worker 监控 -->
        <div class="col-right">
          <div class="panel workers-panel">
            <h3>🤖 Worker 思考流 (Reasoning Trace)</h3>
            <div id="workersContainer" class="workers-grid"></div>
          </div>
        </div>
      </div>

      <!-- 底部：结果与日志 -->
      <div class="bottom-grid">
        <div class="panel result-panel">
          <h3>✨ 最终共识结果</h3>
          <pre id="finalResult">等待产出...</pre>
        </div>

        <div class="panel timeline-panel">
          <h3>📜 系统日志流</h3>
          <ul id="timelineList"></ul>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
    <script>
      // Force load confirmation
      console.log("MAKER Paper Summary Demo Loaded");
      document.getElementById("startBtn").addEventListener("click", () => console.log("Button clicked!"));
    </script>
  </body>
</html>
