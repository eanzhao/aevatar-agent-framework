<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEVATAR MAKER CONSOLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-icon">◈</span>
                <span class="brand-text">AEVATAR</span>
            </div>
            <nav id="project-nav" class="nav-list"></nav>
            <button id="btn-new-project" class="btn-new-project" onclick="showCreateProjectModal()">
                <span>+</span> NEW_PROJECT
            </button>
            <div class="sys-status">
                <div class="sys-row">
                    <span>SYSTEM</span>
                    <span class="status-dot online"></span>
                </div>
                <div class="sys-row">
                    <span>LINK</span>
                    <span class="status-text">SECURE</span>
                </div>
            </div>
        </aside>

        <main class="main-viewport">
            <div id="dashboard" class="dashboard hidden">
                <!-- HUD: Heads Up Display -->
                <header class="hud-header">
                    <div class="hud-title-group">
                        <h1 id="project-name">PROJECT_NAME</h1>
                        <span id="project-id" class="meta-id">ID: 0000-0000</span>
                    </div>
                    <div class="hud-controls">
                        <button id="btn-start" class="btn-action">
                            <span class="btn-icon">⚡</span> INITIALIZE SEQUENCE
                        </button>
                    </div>
                </header>

                <!-- Status Matrix -->
                <div class="matrix-grid">
                    <div class="matrix-cell">
                        <label>STATUS</label>
                        <div id="val-status" class="matrix-val">IDLE</div>
                    </div>
                    <div class="matrix-cell">
                        <label>PHASE</label>
                        <div id="val-phase" class="matrix-val">-</div>
                    </div>
                    <div class="matrix-cell">
                        <label>DEPTH</label>
                        <div id="val-depth" class="matrix-val">0</div>
                    </div>
                    <div class="matrix-cell wide">
                        <label>CURRENT OBJECTIVE</label>
                        <div id="val-objective" class="matrix-val text-scroll">-</div>
                    </div>
                </div>

                <!-- Workspace: Split View -->
                <div class="workspace">
                    <!-- Left: Data Streams -->
                    <div class="panel-col">
                        <!-- Tasks & Planning -->
                        <section class="terminal-window">
                            <div class="term-header">
                                <span class="term-title">>> STRATEGIC_PLANNING</span>
                            </div>
                            <div class="term-body">
                                <div id="pending-tasks" class="tag-cloud"></div>
                                <table class="geek-table">
                                    <thead>
                                        <tr>
                                            <th width="80">ID</th>
                                            <th>DIRECTIVE</th>
                                        </tr>
                                    </thead>
                                    <tbody id="table-steps"></tbody>
                                </table>
                            </div>
                        </section>

                        <!-- Votes & Consensus -->
                        <section class="terminal-window">
                            <div class="term-header">
                                <span class="term-title">>> CONSENSUS_PROTOCOL</span>
                            </div>
                            <div class="term-body">
                                <table class="geek-table">
                                    <thead>
                                        <tr>
                                            <th width="100">CLUSTER</th>
                                            <th width="80">VOTES</th>
                                            <th>PROPOSAL</th>
                                        </tr>
                                    </thead>
                                    <tbody id="table-votes"></tbody>
                                </table>
                            </div>
                        </section>
                    </div>

                    <!-- Right: Logs & Workers & Files -->
                    <div class="panel-col">
                         <section class="terminal-window flex-grow">
                            <div class="term-header tab-header">
                                <button class="tab-btn active" data-target="view-timeline">SYSTEM_LOG</button>
                                <button class="tab-btn" data-target="view-workers">SYSTEM_NODES</button>
                                <button class="tab-btn" data-target="view-files">DATA_CORE</button>
                                <button class="tab-btn" data-target="view-result">FINAL_ARTIFACT</button>
                            </div>
                            <div class="term-content-wrapper">
                                <div id="view-timeline" class="term-view active">
                                    <ul id="log-stream" class="log-list"></ul>
                                </div>
                                <div id="view-workers" class="term-view">
                                    <div id="worker-grid" class="worker-grid"></div>
                                </div>
                                <div id="view-files" class="term-view">
                                    <div class="file-explorer">
                                        <div class="file-list" id="file-list"></div>
                                        <div class="file-preview" id="file-preview">
                                            <div class="preview-placeholder">[ SELECT_FILE ]</div>
                                        </div>
                                    </div>
                                </div>
                                <div id="view-result" class="term-view">
                                    <div id="final-result" class="markdown-content"></div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
            
            <div id="empty-state" class="empty-state">
                <div class="loader-bracket">[ SELECT_MODULE ]</div>
            </div>
        </main>
    </div>

    <!-- Create Project Modal -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="hideCreateProjectModal()">
        <div class="modal-dialog" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title">>> CREATE_NEW_PROJECT</span>
                <button class="modal-close" onclick="hideCreateProjectModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-tabs">
                    <button class="modal-tab active" onclick="switchConfigMode('simple')">SIMPLE</button>
                    <button class="modal-tab" onclick="switchConfigMode('advanced')">ADVANCED</button>
                </div>
                
                <!-- Simple Mode -->
                <div id="mode-simple" class="config-mode active">
                    <div class="form-group">
                        <label>PROJECT_NAME</label>
                        <input type="text" id="cfg-name" value="My Analysis Project" />
                    </div>
                    <div class="form-group">
                        <label>ICON</label>
                        <input type="text" id="cfg-icon" value="🔬" style="width: 60px" />
                    </div>
                    <div class="form-group">
                        <label>DESCRIPTION</label>
                        <input type="text" id="cfg-desc" value="A simple analysis task" />
                    </div>
                    <div class="form-group">
                        <label>TASK_OBJECTIVE</label>
                        <textarea id="cfg-task" rows="5" placeholder="Describe what you want to analyze...">Analyze the following data and provide insights...</textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>RELIABILITY</label>
                            <select id="cfg-reliability">
                                <option value="Low">Low (K=1)</option>
                                <option value="Medium" selected>Medium (K=2)</option>
                                <option value="High">High (K=3)</option>
                                <option value="Critical">Critical (K=4)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>MAX_DEPTH</label>
                            <input type="number" id="cfg-depth" value="2" min="1" max="5" />
                        </div>
                    </div>
                </div>
                
                <!-- Advanced Mode (JSON) -->
                <div id="mode-advanced" class="config-mode">
                    <div class="form-group">
                        <label>CONFIG_JSON</label>
                        <textarea id="cfg-json" rows="16" placeholder="Paste JSON config here..."></textarea>
                    </div>
                    <div class="template-btns">
                        <button class="btn-template" onclick="loadTemplate('simple')">Load Simple Template</button>
                        <button class="btn-template" onclick="loadTemplate('advanced')">Load Advanced Template</button>
                    </div>
                </div>
                
                <!-- Sample Projects -->
                <div class="sample-section">
                    <label class="sample-label">📦 SAMPLE_PROJECTS (点击快速加载)</label>
                    <div id="sample-list" class="sample-list"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="hideCreateProjectModal()">CANCEL</button>
                <button class="btn-create" onclick="createProject()">CREATE_PROJECT</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
